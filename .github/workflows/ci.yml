name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Bevy's Linux system libraries and the lavapipe software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      - name: The committed sounds are what the generator makes
        run: node scripts/sounds/generate.mjs --check
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Run scripts/verify headless
        run: |
          for script in scripts/verify/*.cmds; do
            echo "::group::$script"
            cargo run -- --headless --software-renderer --commands "$script"
            echo "::endgroup::"
          done
      - name: Run scripts/verify/simulation without a renderer
        run: |
          for script in scripts/verify/simulation/*.cmds; do
            echo "::group::$script"
            cargo run -- --headless --no-render --commands "$script"
            echo "::endgroup::"
          done
      - name: Network check (server, a moving client and a rendering client over WebTransport)
        run: |
          cargo build
          node scripts/verify/network/run.mjs --software-renderer
      # The other end of the choices: no optional module at all. Tests only, to keep the run short;
      # every selection is checked locally (scripts/combinations/check.mjs).
      - name: The smallest selection builds and plays its full match
        run: node scripts/combinations/check.mjs rockets-off_items-none --tests-only
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: target/snapshots/
          if-no-files-found: warn

  wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown

  # The browser build, and a browser client playing with native ones. The picture scripts are not run
  # in the browser here (too slow; see CLAUDE.md).
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Bevy's Linux system libraries (the network check runs the native game)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Install wasm-bindgen-cli (the version Cargo.lock pins)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen $version"; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/web/build.mjs
      - name: Network check with a browser client on the page the server serves
        run: |
          cargo build
          node scripts/verify/network/run.mjs --served-page
      - name: Upload browser snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-snapshots
          path: target/snapshots/web/
          if-no-files-found: warn
