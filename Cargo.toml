# Retreat Arena: the game app. It only selects modules, chooses the map and holds configuration.
#
# Engine and modules are git dependencies on the public repositories; Cargo.lock pins the commits
# (`cargo update -p retreat_engine` / `-p retreat_module_arena` takes newer ones). The engine's own
# dependency on its contract crate and the modules' dependency on it resolve to the same checkout,
# so there is one `CommandRegistry` type and no [patch] is needed.

# Its own workspace: a checkout next to other Retreat folders must not join a parent workspace.
[workspace]

[package]
name = "retreat_arena"
description = "Third-person arena shooter built from Retreat modules."
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = "0.20.1"
retreat_engine = { git = "https://github.com/RetreatSoftware/Retreat-Engine-3D" }
retreat_engine_api = { git = "https://github.com/RetreatSoftware/Retreat-Engine-3D" }
# Shared gameplay types (the game's configuration and tests use them).
retreat_gameplay_api = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
# Gameplay modules.
retreat_module_arena = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_health = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_match = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_player_spawn = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_character_movement = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_third_person_camera = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_character_visuals = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_rifle = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_combat_hud = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_projectile_launcher = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_inventory = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }

# Same build profiles as the engine: Bevy is slow unoptimized, and full debug info makes target/ huge.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
# No incremental caches: they were a third of `target/` (cargo uses only this workspace's profiles).
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = false

# Browser builds (scripts/web/build.mjs): the dev settings without debug info, so the browser does not
# download it.
[profile.web-dev]
inherits = "dev"
debug = false
